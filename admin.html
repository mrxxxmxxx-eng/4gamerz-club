<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4Gamerz Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070d;color:#fff;font-family:Arial;padding:20px}
.wrap{max-width:900px;margin:auto}.card{background:#11131b;border:1px solid #ffffff18;border-radius:16px;padding:20px;margin:15px 0}
input,button{font:inherit}.input{width:100%;background:#090a11;color:#fff;border:1px solid #ffffff20;border-radius:9px;padding:11px;margin-top:6px}
button{border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:bold;background:#22d3ee}.danger{background:#ef4444;color:#fff}
.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.images{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.imgbox{background:#090a11;border-radius:12px;overflow:hidden}.imgbox img{width:100%;height:150px;object-fit:cover}.imgbox div{padding:8px}
.ok{color:#31f7a4}.err{color:#ff7777}.muted{color:#999;font-size:13px}
@media(max-width:700px){.grid,.prices,.images{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="wrap">

<section id="login" class="card">
<h1>🔐 4GAMERZ Admin</h1>
<p class="muted">لوحة التحكم</p>
<input id="password" class="input" type="password" placeholder="كلمة المرور">
<button id="loginBtn" style="width:100%;margin-top:10px">دخول</button>
<div id="loginMsg"></div>
</section>

<section id="dash" class="hidden">

<div style="display:flex;justify-content:space-between;align-items:center">
<h1>⚙️ لوحة التحكم</h1>
<button id="logoutBtn">تسجيل خروج</button>
</div>

<div id="msg" class="card"></div>

<div class="card">
<h2>📞 البيانات</h2>
<div class="grid">
<label>اسم المكان<input id="siteName" class="input"></label>
<label>التليفون<input id="phone" class="input"></label>
<label>واتساب بدون +<input id="whatsapp" class="input"></label>
<label>الشريط التعريفي<input id="announcement" class="input"></label>
<label>العنوان<input id="address" class="input"></label>
<label>تفاصيل العنوان<input id="addressLine" class="input"></label>
<label style="grid-column:1/-1">Google Maps<input id="mapsQuery" class="input"></label>
</div>
</div>

<div class="card">
<h2>💰 الأسعار</h2>
<div id="prices" class="prices"></div>
</div>

<div class="card">
<h2>🖼️ الصور</h2>
<input id="file" class="input" type="file" accept="image/*">
<input id="alt" class="input" placeholder="وصف الصورة">
<button id="uploadBtn" style="margin-top:10px">+ إضافة صورة</button>
<div id="images" class="images" style="margin-top:15px"></div>
</div>

<div class="card">
<button id="saveBtn">💾 حفظ التعديلات</button>
</div>

</section>
</div>

<script>
let state={config:{},images:[]};
const $=id=>document.getElementById(id);

function esc(x){
return String(x||'').replace(/[&<>"']/g,m=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));
}

function show(t,ok=true){
$('msg').innerHTML='<span class="'+(ok?'ok':'err')+'">'+esc(t)+'</span>';
}
async function login(){
  let password=$('password').value.trim();

  if(!password){
    $('loginMsg').innerHTML='<p class="err">اكتب الباسورد</p>';
    return;
  }

  $('loginBtn').disabled=true;
  $('loginBtn').textContent='جاري الدخول...';

  try{
    let r=await fetch('/api/login',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({password})
    });

    let text=await r.text();

    let d;
    try{ d=JSON.parse(text); }
    catch(e){ d={error:text||'السيرفر لم يرجع بيانات'}; }

    if(!r.ok){
      $('loginMsg').innerHTML=
        '<p class="err">خطأ '+r.status+': '+esc(d.error)+'</p>';
      return;
    }

    await load();
    $('login').classList.add('hidden');
    $('dash').classList.remove('hidden');

  }catch(e){
    console.error(e);
    $('loginMsg').innerHTML=
      '<p class="err">خطأ الاتصال: '+esc(e.message)+'</p>';
  }finally{
    $('loginBtn').disabled=false;
    $('loginBtn').textContent='دخول';
  }
}

async function load(){
let r=await fetch('/api/config');
if(!r.ok)throw Error('load');
state=await r.json();

let c=state.config||{};
['siteName','phone','whatsapp','announcement','address','addressLine','mapsQuery']
.forEach(k=>$(k).value=c[k]||'');

renderPrices(c.prices||[]);
renderImages(state.images||[]);
}

function renderPrices(ps){
$('prices').innerHTML=ps.map((p,i)=>`
<div class="card">
<b>الباقة ${i+1}</b>
<input data-k="name" class="input" value="${esc(p.name)}" placeholder="اسم الباقة">
<input data-k="hours" class="input" value="${esc(p.hours)}" placeholder="المدة">
<input data-k="price" type="number" class="input" value="${Number(p.price)||0}" placeholder="السعر">
</div>`).join('');
}

function renderImages(imgs){
$('images').innerHTML=imgs.map(x=>`
<div class="imgbox">
<img src="${esc(x.url)}">
<div>
<small>${esc(x.alt)}</small><br>
<button class="danger del" data-id="${x.id}">حذف</button>
</div>
</div>`).join('');

document.querySelectorAll('.del').forEach(b=>
b.onclick=()=>delImg(b.dataset.id)
);
}

async function save(){
try{
let prices=[...document.querySelectorAll('.prices .card')].map(e=>({
name:e.querySelector('[data-k=name]').value,
hours:e.querySelector('[data-k=hours]').value,
price:Number(e.querySelector('[data-k=price]').value||0)
}));

let data={
siteName:$('siteName').value,
phone:$('phone').value,
whatsapp:$('whatsapp').value,
announcement:$('announcement').value,
address:$('address').value,
addressLine:$('addressLine').value,
mapsQuery:$('mapsQuery').value,
prices
};

let r=await fetch('/api/config',{
method:'PUT',
headers:{'content-type':'application/json'},
body:JSON.stringify(data)
});

show(r.ok?'تم الحفظ ✅':'فشل الحفظ',r.ok);
}catch(e){show('حصل خطأ',false)}
}

async function upload(){
let f=$('file').files[0];
if(!f)return show('اختار صورة الأول',false);
if(f.size>1048576)return show('الصورة أكبر من 1MB',false);

try{
let fd=new FormData();
fd.append('file',f);
fd.append('alt',$('alt').value||'4Gamerz Club');

let r=await fetch('/api/images',{method:'POST',body:fd});
let d=await r.json();

if(!r.ok)return show(d.error||'فشل الرفع',false);

$('file').value='';
$('alt').value='';
await load();
show('تمت إضافة الصورة ✅');
}catch(e){show('فشل رفع الصورة',false)}
}

async function delImg(id){
if(!confirm('تحذف الصورة؟'))return;

try{
let r=await fetch('/api/images/'+id,{method:'DELETE'});
if(r.ok){await load();show('تم الحذف ✅')}
else show('فشل الحذف',false);
}catch(e){show('حصل خطأ',false)}
}

async function logout(){
await fetch('/api/logout',{method:'POST'}).catch(()=>{});
location.reload();
}

$('loginBtn').onclick=login;
$('password').onkeydown=e=>{if(e.key==='Enter')login()};
$('saveBtn').onclick=save;
$('uploadBtn').onclick=upload;
$('logoutBtn').onclick=logout;
</script>

</body>
</html>
