<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4Gamerz Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#07070d;color:#f6f7ff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#11131b;border:1px solid #ffffff18;border-radius:20px;padding:22px;margin:15px 0}.login{max-width:420px;margin:10vh auto}.input,textarea,button{font:inherit}.input,textarea{width:100%;background:#090a11;color:white;border:1px solid #ffffff20;border-radius:10px;padding:12px;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:#22d3ee;color:#041014;font-weight:800}.danger{background:#ef4444;color:white}.muted{color:#9a9cab;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.hidden{display:none}.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.price{border:1px solid #ffffff14;border-radius:14px;padding:12px}.images{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.imgbox{border:1px solid #ffffff15;border-radius:14px;overflow:hidden;background:#0b0c12}.imgbox img{width:100%;height:170px;object-fit:cover}.imgbox div{padding:10px}.status{padding:10px;border-radius:10px;background:#ffffff08;margin:10px 0}.ok{color:#31f7a4}.err{color:#ff7b7b}@media(max-width:700px){.grid,.prices,.images{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<section id="login" class="card login"><h1>🔐 4GAMERZ Admin</h1><p class="muted">لوحة التحكم الخاصة بصاحب الموقع.</p><input id="password" class="input" type="password" placeholder="كلمة المرور"><button class="btn" style="width:100%;margin-top:12px" onclick="adminlogin()">دخول</button><div id="loginMsg"></div></section>
<section id="dash" class="hidden"><div class="top"><div><h1>⚙️ لوحة التحكم</h1><p class="muted">غيّر البيانات واحفظها، وستظهر للزوار.</p></div><button class="btn" onclick="logout()">تسجيل خروج</button></div><div id="msg" class="status"></div>
<div class="card"><h2>📞 البيانات الأساسية</h2><div class="grid"><label>اسم المكان<input id="siteName" class="input"></label><label>رقم التليفون<input id="phone" class="input"></label><label>رقم واتساب بدون +<input id="whatsapp" class="input"></label><label>الشريط التعريفي<input id="announcement" class="input"></label><label>العنوان<input id="address" class="input"></label><label>تفاصيل العنوان<input id="addressLine" class="input"></label><label style="grid-column:1/-1">بحث Google Maps<input id="mapsQuery" class="input"></label></div></div>
<div class="card"><h2>💰 الأسعار</h2><div id="prices" class="prices"></div></div>
<div class="card"><h2>🖼️ صور المكان</h2><input id="file" class="input" type="file" accept="image/*"><input id="alt" class="input" placeholder="وصف الصورة (اختياري)"><button class="btn" style="margin-top:10px" onclick="upload()">+ إضافة صورة</button><div id="images" class="images" style="margin-top:15px"></div></div>
<div class="card"><button class="btn" onclick="save()">💾 حفظ كل التعديلات</button></div></section></main>
<script>
let state={config:{},images:[]};const $=id=>document.getElementById(id);function msg(t,ok=true){$('msg').innerHTML='<span class="'+(ok?'ok':'err')+'">'+t+'</span>'}
async function  adminlogin(){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('password').value})});const d=await r.json();if(!r.ok){$('loginMsg').innerHTML='<p class="err">'+(d.error||'فشل الدخول')+'</p>';return}await load();$('login').classList.add('hidden');$('dash').classList.remove('hidden')}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
async function load(){const r=await fetch('/api/config');state=await r.json();const c=state.config||{};['siteName','phone','whatsapp','announcement','address','addressLine','mapsQuery'].forEach(k=>$(k).value=c[k]||'');renderPrices(c.prices||[]);renderImages(state.images||[])}
function renderPrices(ps){$('prices').innerHTML=ps.map((p,i)=>`<div class="price"><label>الباقة ${i+1}<input data-p="${i}" data-k="name" class="input" value="${esc(p.name)}"></label><label>الوصف<input data-p="${i}" data-k="hours" class="input" value="${esc(p.hours)}"></label><label>السعر<input data-p="${i}" data-k="price" type="number" class="input" value="${Number(p.price)||0}"></label></div>`).join('')}
function renderImages(imgs){$('images').innerHTML=imgs.map(x=>`<div class="imgbox"><img src="${x.url}"><div><small>${esc(x.alt)}</small><br><button class="btn danger" onclick="delImg(${x.id})">حذف</button></div></div>`).join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function save(){const prices=[...document.querySelectorAll('.price')].map((el,i)=>({name:el.querySelector('[data-k=name]').value,hours:el.querySelector('[data-k=hours]').value,price:Number(el.querySelector('[data-k=price]').value||0)}));const data={siteName:$('siteName').value,phone:$('phone').value,whatsapp:$('whatsapp').value,announcement:$('announcement').value,address:$('address').value,addressLine:$('addressLine').value,mapsQuery:$('mapsQuery').value,prices};const r=await fetch('/api/config',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(r.ok){msg('تم حفظ التعديلات ✅')}else msg('حصل خطأ أثناء الحفظ',false)}
async function upload(){const f=$('file').files[0];if(!f)return msg('اختار صورة الأول',false);const fd=new FormData();fd.append('file',f);fd.append('alt',$('alt').value||'4Gamerz Club');const r=await fetch('/api/images',{method:'POST',body:fd});if(!r.ok){const d=await r.json();return msg(d.error||'فشل رفع الصورة',false)}$('file').value='';$('alt').value='';await load();msg('تمت إضافة الصورة ✅')}
async function delImg(id){if(!confirm('تحذف الصورة؟'))return;const r=await fetch('/api/images/'+id,{method:'DELETE'});if(r.ok){await load();msg('تم حذف الصورة')}else msg('فشل الحذف',false)}
load().then(()=>{}).catch(()=>{});
</script></body></html>
